<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .score-board span {
            color: #00ff88;
            font-weight: bold;
        }

        canvas {
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            background: #16213e;
        }

        .controls {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }

        .controls kbd {
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            color: #eee;
        }

        #startBtn {
            margin-top: 15px;
            padding: 12px 40px;
            font-size: 1.2rem;
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #startBtn:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .overlay.active {
            pointer-events: all;
        }

        .game-over-text {
            font-size: 2rem;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <div class="score-board">
            <div>Score: <span id="score">0</span></div>
            <div>High Score: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>Gunakan <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> atau <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> untuk bergerak</p>
            <p style="margin-top: 5px;">Tekan <kbd>P</kbd> untuk pause</p>
        </div>
        <button id="startBtn" onclick="startGame()">Mulai Bermain</button>
        <p class="game-over-text" id="gameOverText">Game Over!</p>
    </div>

    <script>
        // ==================== KONFIGURASI GAME ====================
        const CANVAS_SIZE = 400;
        const GRID_SIZE = 20;
        const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
        const INITIAL_SPEED = 150; // ms per frame (semakin kecil semakin cepat)
        const SPEED_INCREMENT = 2; // ms lebih cepat setiap makan

        // ==================== STATE GAME ====================
        let canvas, ctx;
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameLoop = null;
        let speed = INITIAL_SPEED;
        let isPlaying = false;
        let isPaused = false;

        // ==================== INISIALISASI ====================
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            document.getElementById('highScore').textContent = highScore;

            // Event listener untuk kontrol
            document.addEventListener('keydown', handleKeyPress);

            // Tampilkan grid awal
            drawGrid();
        }

        function startGame() {
            // Reset state
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = INITIAL_SPEED;
            isPaused = false;

            document.getElementById('score').textContent = score;
            document.getElementById('gameOverText').style.display = 'none';
            document.getElementById('startBtn').textContent = 'Restart';

            spawnFood();

            // Mulai game loop
            if (gameLoop) clearInterval(gameLoop);
            isPlaying = true;
            gameLoop = setInterval(gameStep, speed);
        }

        // ==================== GAME LOOP ====================
        function gameStep() {
            if (isPaused) return;

            // Update arah
            direction = { ...nextDirection };

            // Hitung posisi kepala baru
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Cek tabrakan dengan dinding
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Cek tabrakan dengan badan sendiri
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            // Tambah kepala baru
            snake.unshift(head);

            // Cek apakah makan makanan
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;

                // Update high score
                if (score > highScore) {
                    highScore = score;
                    document.getElementById('highScore').textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }

                // Spawn makanan baru
                spawnFood();

                // Tingkatkan kecepatan
                speed = Math.max(50, speed - SPEED_INCREMENT);
                clearInterval(gameLoop);
                gameLoop = setInterval(gameStep, speed);
            } else {
                // Hapus ekor jika tidak makan
                snake.pop();
            }

            // Gambar ulang
            draw();
        }

        // ==================== RENDERING ====================
        function draw() {
            // Bersihkan canvas
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Gambar grid (subtle)
            drawGrid();

            // Gambar makanan
            drawFood();

            // Gambar ular
            drawSnake();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 0.5;

            for (let i = 0; i <= GRID_SIZE; i++) {
                // Garis vertikal
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                ctx.stroke();

                // Garis horizontal
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;

                if (index === 0) {
                    // Kepala - lebih terang
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 10;
                } else {
                    // Badan - gradient dari terang ke gelap
                    const brightness = 1 - (index / snake.length) * 0.6;
                    ctx.fillStyle = `rgba(0, ${Math.floor(255 * brightness)}, ${Math.floor(136 * brightness)}, 1)`;
                    ctx.shadowBlur = 0;
                }

                // Gambar rounded rectangle
                const padding = 1;
                const radius = 4;
                roundRect(
                    ctx,
                    x + padding,
                    y + padding,
                    CELL_SIZE - padding * 2,
                    CELL_SIZE - padding * 2,
                    radius
                );
                ctx.fill();

                // Mata pada kepala
                if (index === 0) {
                    drawEyes(x, y);
                }
            });

            ctx.shadowBlur = 0;
        }

        function drawEyes(x, y) {
            ctx.fillStyle = '#1a1a2e';
            const eyeSize = 3;
            let eye1X, eye1Y, eye2X, eye2Y;

            if (direction.x === 1) { // Kanan
                eye1X = x + CELL_SIZE - 7; eye1Y = y + 6;
                eye2X = x + CELL_SIZE - 7; eye2Y = y + CELL_SIZE - 6;
            } else if (direction.x === -1) { // Kiri
                eye1X = x + 7; eye1Y = y + 6;
                eye2X = x + 7; eye2Y = y + CELL_SIZE - 6;
            } else if (direction.y === -1) { // Atas
                eye1X = x + 6; eye1Y = y + 7;
                eye2X = x + CELL_SIZE - 6; eye2Y = y + 7;
            } else { // Bawah
                eye1X = x + 6; eye1Y = y + CELL_SIZE - 7;
                eye2X = x + CELL_SIZE - 6; eye2Y = y + CELL_SIZE - 7;
            }

            ctx.beginPath();
            ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawFood() {
            const x = food.x * CELL_SIZE;
            const y = food.y * CELL_SIZE;
            const centerX = x + CELL_SIZE / 2;
            const centerY = y + CELL_SIZE / 2;

            // Efek glow
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 15;

            // Gambar makanan (apel)
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(centerX, centerY, CELL_SIZE / 2 - 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;

            // Detail apel
            ctx.fillStyle = '#44ff44';
            ctx.beginPath();
            ctx.ellipse(centerX + 2, y + 4, 3, 5, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
        }

        // ==================== LOGIKA GAME ====================
        function spawnFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
            food = newFood;
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameLoop);

            // Efek kedip
            let flashes = 0;
            const flashInterval = setInterval(() => {
                if (flashes >= 6) {
                    clearInterval(flashInterval);
                    document.getElementById('gameOverText').style.display = 'block';
                    document.getElementById('startBtn').textContent = 'Main Lagi';
                    return;
                }

                ctx.fillStyle = flashes % 2 === 0 ? 'rgba(255, 0, 0, 0.3)' : '#16213e';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                if (flashes % 2 === 0) {
                    drawGrid();
                    drawSnake();
                    drawFood();
                }

                flashes++;
            }, 150);
        }

        // ==================== KONTROL ====================
        function handleKeyPress(e) {
            if (!isPlaying) return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
                case 'p':
                case 'P':
                    isPaused = !isPaused;
                    if (isPaused) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                        ctx.fillStyle = '#fff';
                        ctx.font = '30px Segoe UI';
                        ctx.textAlign = 'center';
                        ctx.fillText('PAUSED', CANVAS_SIZE / 2, CANVAS_SIZE / 2);
                    } else {
                        draw();
                    }
                    break;
            }
        }

        // ==================== START ====================
        window.onload = init;
    </script>
</body>
</html>
