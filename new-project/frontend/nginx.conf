server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: serve index.html for any path that isn't a real file.
    # API calls (/api/*) never reach here — Caddy routes those to the backend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
